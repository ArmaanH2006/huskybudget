<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuskyBudget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HuskyBudget</h1>
    <label class="month-picker">
      Month
      <input type="month" id="month">
    </label>
  </header>

  <section class="cards">
    <div class="card"><span class="label">Income</span><span class="value in" id="income">–</span></div>
    <div class="card"><span class="label">Spending</span><span class="value out" id="spending">–</span></div>
    <div class="card"><span class="label">Net</span><span class="value" id="net">–</span></div>
  </section>

    <section class="panel">
    <h2>Where the money went</h2>
    <div id="category-chart" class="bars" role="table" aria-label="Spending by category"></div>
    <p id="chart-empty" class="muted" hidden>No spending this month.</p>
  </section>

  <section class="panel">
    <h2>Add a transaction</h2>
    <form id="add-form">
      <input type="date" name="date" required>
      <select name="kind">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <input name="amount" placeholder="Amount" inputmode="decimal" required>
      <input name="category" placeholder="Category" list="categories" required>
      <input name="merchant" placeholder="Merchant (optional)">
      <button type="submit">Add</button>
    </form>
    <datalist id="categories"></datalist>
    <p id="form-error" class="error" hidden></p>
  </section>

  <section class="panel">
    <h2>Transactions</h2>
    <p id="status" class="muted">Loading…</p>
    <table>
      <thead>
        <tr><th>Date</th><th>Merchant</th><th>Category</th><th class="num">Amount</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
