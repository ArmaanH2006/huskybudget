<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuskyBudget</title>
  <style>
    body  { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2933; }
    h1    { margin-bottom: 4px; }
    #status { color: #616e7c; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e4e7eb; }
    th    { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #616e7c; }
    td.amount, th.amount { text-align: right; font-variant-numeric: tabular-nums; }
    .out  { color: #c62828; }
    .in   { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>HuskyBudget</h1>
  <p id="status">Loading…</p>

  <table>
    <thead>
      <tr><th>Date</th><th>Merchant</th><th>Category</th><th class="amount">Amount</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
